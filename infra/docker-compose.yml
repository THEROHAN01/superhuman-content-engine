# Superhuman Content Engine - local runtime.
#
# Start:  infra/scripts/start.sh            (infrastructure only)
#         infra/scripts/start.sh --with-app (adds api + workers, requires an image build)
# Stop:   infra/scripts/stop.sh
# Reset:  infra/scripts/reset.sh --force    (DESTROYS all local data)
#
# Image tags are pinned deliberately. Verify a new tag exists before bumping it.
name: sce

x-common-env: &common-env
  TZ: ${TZ:-Asia/Kolkata}

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: sce-postgres
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER:-sce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy infra/.env.example to infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-sce}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Deterministic collation/encoding so migrations behave identically everywhere.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command:
      - postgres
      - -c
      - timezone=${TZ:-Asia/Kolkata}
      - -c
      - log_timezone=${TZ:-Asia/Kolkata}
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sce} -d ${POSTGRES_DB:-sce}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [sce-net]

  redis:
    image: redis:7.4-alpine
    container_name: sce-redis
    restart: unless-stopped
    environment: *common-env
    # Durable enough for idempotency locks; Postgres remains the source of truth.
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [sce-net]

  n8n:
    image: n8nio/n8n:2.40.5
    container_name: sce-n8n
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Credentials are encrypted at rest with this key; losing it means recreating credentials.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-sce}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Local retention: keep enough history to debug, not enough to fill the disk.
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTION_MAX_AGE_HOURS:-336}
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_RUNNERS_ENABLED: 'true'
      # The API is reachable from workflows under this base URL.
      SCE_API_BASE_URL: http://api:${API_PORT:-8080}
    ports:
      - '127.0.0.1:${N8N_PORT:-5678}:5678'
    volumes:
      - n8n-data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [sce-net]

  ollama:
    image: ollama/ollama:0.34.2
    container_name: sce-ollama
    restart: unless-stopped
    environment:
      <<: *common-env
      OLLAMA_MODELS: /root/.ollama/models
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    ports:
      - '127.0.0.1:${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [sce-net]

  api:
    profiles: ['app']
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: sce-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: ${API_PORT:-8080}
      API_BIND: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-sce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sce}
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      PUBLISH_MODE: ${PUBLISH_MODE:-dry_run}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-mock}
      PUBLISHING_PROVIDER: ${PUBLISHING_PROVIDER:-mock}
      TELEGRAM_PROVIDER: ${TELEGRAM_PROVIDER:-mock}
      CAPTURE_API_TOKEN: ${CAPTURE_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      POSTIZ_BASE_URL: ${POSTIZ_BASE_URL:-}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - '127.0.0.1:${API_PORT:-8080}:${API_PORT:-8080}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:''+(process.env.API_PORT||8080)+''/health/live'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sce-net]

  workers:
    profiles: ['app']
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    command: ['node', 'dist/workers/main.js']
    container_name: sce-workers
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-sce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sce}
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://api:${API_PORT:-8080}
      PUBLISH_MODE: ${PUBLISH_MODE:-dry_run}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-mock}
      PUBLISHING_PROVIDER: ${PUBLISHING_PROVIDER:-mock}
      TELEGRAM_PROVIDER: ${TELEGRAM_PROVIDER:-mock}
    networks: [sce-net]

volumes:
  postgres-data:
    name: sce-postgres-data
  redis-data:
    name: sce-redis-data
  n8n-data:
    name: sce-n8n-data
  ollama-models:
    name: sce-ollama-models

networks:
  sce-net:
    name: sce-net
    driver: bridge
